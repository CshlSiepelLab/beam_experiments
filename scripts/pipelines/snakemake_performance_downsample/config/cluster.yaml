__default__:
  cores: 1
  mem: '5G'
  logout: '{outdir}/job_logs/{wildcards.sim}/{rule}.out'
  logerror: '{outdir}/job_logs/{wildcards.sim}/{rule}.err'
  runtime: 12:00:00  # 12 hours timelimit for all methods

downsampleInputs:
  cores: '{params.threads}'
  logout: '{outdir}/job_logs/{wildcards.sim}/{rule}_{wildcards.threshold}.out'
  logerror: '{outdir}/job_logs/{wildcards.sim}/{rule}_{wildcards.threshold}.err'
  mem: '1G'

runMetastabayes:
  cores: 5
  mem: '2G' # need total of 5GB for java BEAST2 submission command in the Snakefile

plotPrecisionRecall:
  cores: 1
  mem: '5G'
  logout: '{outdir}/job_logs/{rule}.out'
  logerror: '{outdir}/job_logs/{rule}.err'

  