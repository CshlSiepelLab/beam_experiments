# set path to data dirs
inputpath: /grid/siepel/home/staklins/projects/crispr_barcode/results/beam/latest_results/yang_preprocess_2022_lung_cancer_data

# set where output should go (data is also copied there initially to retain original data in raw form)
outdir: /grid/siepel/home/staklins/projects/crispr_barcode/results/beam/latest_results/yang_results_2022_lung_cancer_data

# Set path to file with clones to keep
clonesToKeep: /grid/siepel/home/staklins/projects/crispr_barcode/results/beam/latest_results/yang_preprocess_2022_lung_cancer_data/yang_clone_summary_stats_subset.tsv

# primary tissue name
primaryTissue: T

# set path to the beam model xml template file
gtrXml: /grid/siepel/home/staklins/projects/crispr_barcode/beam/bayesian_phylogenetic_metastasis/inputs/beam_gtr_mcmc_template.xml
randomXml: /grid/siepel/home/staklins/projects/crispr_barcode/beam/bayesian_phylogenetic_metastasis/inputs/beam_random_mcmc_template.xml

# thresholds for consensus classifications and times
thresholds: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99]

# set the length of the experiment
# for simeonov et al data, both laster "approximately 5 weeks", so we will set this in days
experimentTime:
  3457_Apc_T1: 185
  3519_Lkb1_T1: 110
  3508_Apc_T2: 185
  3513_NT_T1: 181
  3457_Apc_T4: 185

# set the desired mcmc chain length and number of chains to run in parallel
mcmcLength: 500000000
numChains: 3

# set the minimum ess to include a chain in the combined output across chains (default: 200)
essCutoff: 200

# set path to scripts and executables
scripts: /grid/siepel/home/staklins/projects/crispr_barcode/beam/bayesian_phylogenetic_metastasis/scripts
containers: /grid/siepel/home/staklins/containers
treeannotator: /grid/siepel/home/staklins/bin/beast/bin/treeannotator
logcombiner: /grid/siepel/home/staklins/bin/beast/bin/logcombiner
