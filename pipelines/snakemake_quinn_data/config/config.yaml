# set path to data dirs
inputpath: /grid/siepel/home/staklins/stored_data/crispr_barcode_related_data/quinn_2021_real_data/GSE161363

# set where output should go (data is also copied there initially to retain original data in raw form)
outdir: /grid/siepel/home/staklins/stored_results/beam/latest_results/quinn_2021_lung_cancer_data

# primary tissue name
primaryTissue: LL

# set path to the beam model xml template file
gtrXml: /grid/siepel/home/staklins/projects/crispr_barcode/bayesian_phylogenetic_metastasis/inputs/beam_gtr_mcmc_template.xml
randomXml: /grid/siepel/home/staklins/projects/crispr_barcode/bayesian_phylogenetic_metastasis/inputs/beam_random_mcmc_template.xml

gtrXmlNoRLDirectSeeding: /grid/siepel/home/staklins/projects/crispr_barcode/bayesian_phylogenetic_metastasis/inputs/beam_gtr_noSpecifiedTissuedirectSeeding_mcmc_template.xml

# thresholds for consensus classifications and times
thresholds: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99]

# set the length of the experiment
# for Quinn et al. 2021 data, the experiment lengths vary by mouse and are found in the supplementary figures caption by searching "days post-implantation"
experimentTime:
  5k: 54
  10k: 53
  100k: 67
  30k: 80

# set the desired mcmc chain length and number of chains to run in parallel
mcmcLength: 250000000
numChains: 3

# set the minimum ess to include a chain in the combined output across chains (default: 200)
essCutoff: 200

# set path to scripts and executables
scripts: /grid/siepel/home/staklins/projects/crispr_barcode/bayesian_phylogenetic_metastasis/scripts
containers: /grid/siepel/home/staklins/containers
treeannotator: /grid/siepel/home/staklins/bin/beast/bin/treeannotator
logcombiner: /grid/siepel/home/staklins/bin/beast/bin/logcombiner
